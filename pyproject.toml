[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-admin-mcp"
version = "0.2.0"
description = "MCP Server for remote server administration via SSH — execute commands, manage files, edit configs, transfer files, control services. No agents needed on target servers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Frank Schaellert", email = "intershopper@gmx.de"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "mcp>=1.26.0",
    "paramiko>=3.4.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pyjwt[crypto]>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
remote-admin-mcp = "ssh_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/intershopper/remote-admin-mcp"
Repository = "https://github.com/intershopper/remote-admin-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/ssh_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
